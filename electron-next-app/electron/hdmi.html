<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "MyriadPro";
        src:
          url("../public/fonts/MyriadPro/MyriadProRegular/MyriadProRegular.woff")
            format("woff"),
          url("../public/fonts/MyriadPro/MyriadProRegular/MyriadProRegular.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 400;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("../public/fonts/MyriadPro/MyriadProItalic/MyriadProItalic.woff")
            format("woff"),
          url("../public/fonts/MyriadPro/MyriadProItalic/MyriadProItalic.ttf")
            format("truetype");
        font-style: italic;
        font-weight: 400;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("../public/fonts/MyriadPro/MyriadProSemiBold/MyriadProSemiBold.woff")
            format("woff"),
          url("../public/fonts/MyriadPro/MyriadProSemiBold/MyriadProSemiBold.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 600;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("../public/fonts/MyriadPro/MyriadProBold/MyriadProBold.woff")
            format("woff"),
          url("../public/fonts/MyriadPro/MyriadProBold/MyriadProBold.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #000000;
      }
      body {
        color: #ffffff;
        font-family: "MyriadPro", Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        white-space: pre-wrap;
        text-align: center;
        /* Základní velikost textu — trochu menší než dřív (5vw → 4vw)
           aby "pár slov" nebylo obří. Dlouhý text se pořád scale-uje dolů. */
        font-size: 4vw;
        padding: 3vh 2vw;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        cursor: none;
      }
      #content {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        opacity: 1;
        gap: 2.5vh;
        will-change: opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
        transition: opacity 0.5s ease-in-out;
      }
      #content.blackout {
        opacity: 0;
      }
      /* Silnější viditelný divider mezi PL a EN. Bylo 1px #444 (skoro neviditelný). */
      .divider {
        border-top: 3px solid #aaaaaa;
        width: 55%;
        margin: 2vh auto;
        opacity: 0.85;
      }
      /* Sequence / labels nahoře a dole — dřív 0.8vw (nečitelné na velké obrazovce).
         1.8vw = na 4K screenu ~70px, na 1080p ~35px. Čitelné z několika metrů. */
      .sequence {
        font-size: 1.8vw;
        color: #cccccc;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 0 3vw;
        flex-shrink: 0;
      }
      .title-row {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 0 3vw;
        flex-shrink: 0;
      }
      .text-block {
        flex: 1 1 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-height: 0;
        min-width: 0;
        width: 100%;
        padding: 1vh 0;
      }
      .text-fit {
        white-space: pre-wrap;
        text-align: center;
        transform-origin: center center;
        max-width: 100%;
        font-weight: 600;
        line-height: 1.3;
      }
      .text-fit.text-justify {
        text-align: justify;
        text-justify: inter-word;
        padding: 0 4vw;
      }
      .text-fit.text-italic {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const { ipcRenderer } = require("electron");

      function fitContent() {
        const fits = Array.from(document.querySelectorAll(".text-fit"));
        fits.forEach((el) => {
          el.style.transform = "";
        });
        requestAnimationFrame(() => {
          // Nejdřív spočítej per-element scale.
          const scales = fits.map((el) => {
            const parent = el.parentElement;
            if (!parent) return 1;
            const pw = parent.clientWidth;
            const ph = parent.clientHeight;
            const w = el.scrollWidth;
            const h = el.scrollHeight;
            if (!pw || !ph || !w || !h) return 1;
            return Math.min(pw / w, ph / h, 1);
          });

          // Když je víc než jeden text-fit (typicky PL + EN), použij MIN scale
          // pro všechny — aby PL a EN byly stejně velké i když má jeden víc textu.
          const applied = scales.length > 1
            ? scales.map(() => Math.min(...scales))
            : scales;

          fits.forEach((el, i) => {
            const s = applied[i];
            if (s < 1) el.style.transform = "scale(" + s + ")";
          });
        });
      }

      ipcRenderer.on("hdmi-update", (_, html) => {
        document.getElementById("content").innerHTML = html;
        fitContent();
      });

      ipcRenderer.on("hdmi-blackout", (_, active) => {
        const el = document.getElementById("content");
        if (active) el.classList.add("blackout");
        else el.classList.remove("blackout");
      });

      window.addEventListener("resize", fitContent);
    </script>
  </body>
</html>
