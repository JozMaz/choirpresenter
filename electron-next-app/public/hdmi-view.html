<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "MyriadPro";
        src:
          url("fonts/MyriadPro/MyriadProRegular/MyriadProRegular.woff")
            format("woff"),
          url("fonts/MyriadPro/MyriadProRegular/MyriadProRegular.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 400;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("fonts/MyriadPro/MyriadProItalic/MyriadProItalic.woff")
            format("woff"),
          url("fonts/MyriadPro/MyriadProItalic/MyriadProItalic.ttf")
            format("truetype");
        font-style: italic;
        font-weight: 400;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("fonts/MyriadPro/MyriadProSemiBold/MyriadProSemiBold.woff")
            format("woff"),
          url("fonts/MyriadPro/MyriadProSemiBold/MyriadProSemiBold.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 600;
      }
      @font-face {
        font-family: "MyriadPro";
        src:
          url("fonts/MyriadPro/MyriadProBold/MyriadProBold.woff")
            format("woff"),
          url("fonts/MyriadPro/MyriadProBold/MyriadProBold.ttf")
            format("truetype");
        font-style: normal;
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #000000;
      }
      body {
        color: #ffffff;
        font-family: "MyriadPro", Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        white-space: pre-wrap;
        text-align: center;
        font-size: 4vw;
        padding: 3vh 2vw;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        cursor: none;
      }
      #content {
        position: relative;
        width: 100%;
        height: 100%;
        opacity: 1;
        will-change: opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
        transition: opacity 0.5s ease-in-out;
      }
      #content.blackout {
        opacity: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        gap: 2.5vh;
        opacity: 0;
        will-change: opacity;
        transition: opacity 320ms ease-in-out;
      }
      .layer.active {
        opacity: 1;
      }
      .divider {
        border-top: 3px solid #aaaaaa;
        width: 55%;
        margin: 2vh auto;
        opacity: 0.85;
      }
      .sequence {
        font-size: 1.8vw;
        color: #cccccc;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 0 3vw;
        flex-shrink: 0;
      }
      .title-row {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 0 3vw;
        flex-shrink: 0;
      }
      .text-block {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-height: 0;
        min-width: 0;
        width: 100%;
        padding: 1vh 0;
      }
      .out2 {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }
      .out2 .divider {
        margin: 0 auto;
        flex: 0 0 auto;
      }
      .text-block.roomy {
        padding: 4vh 0;
      }
      .text-block.roomy-top {
        align-items: flex-end;
        padding: 4vh 0 0.5vh;
      }
      .text-block.roomy-bottom {
        align-items: flex-start;
        padding: 0.5vh 0 4vh;
      }
      .text-block.roomy-top .text-fit {
        transform-origin: center bottom;
      }
      .text-block.roomy-bottom .text-fit {
        transform-origin: center top;
      }
      .layer > .divider {
        margin: 0.5vh auto;
      }
      .text-block.align-bottom {
        align-items: flex-end;
        padding: 1vh 0 4vh;
      }
      .text-block.align-top {
        align-items: flex-start;
        padding: 4vh 0 1vh;
      }
      .text-block.align-bottom .text-fit {
        transform-origin: center bottom;
      }
      .text-block.align-top .text-fit {
        transform-origin: center top;
      }
      .text-fit {
        white-space: pre-wrap;
        text-align: center;
        transform-origin: center center;
        max-width: 100%;
        font-weight: 600;
        line-height: 1.3;
      }
      .text-fit.text-justify {
        text-align: justify;
        text-justify: inter-word;
        padding: 0 4vw;
      }
      .text-fit.text-italic {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <div class="layer active"></div>
      <div class="layer"></div>
    </div>
    <script>
      const isEmbedded = window.top !== window;
      const ipcRenderer =
        !isEmbedded && typeof require === "function"
          ? require("electron").ipcRenderer
          : { on() {} };

      const MAX_GROW = 1.2;

      function innerBox(el) {
        const cs = getComputedStyle(el);
        return {
          w:
            el.clientWidth -
            parseFloat(cs.paddingLeft) -
            parseFloat(cs.paddingRight),
          h:
            el.clientHeight -
            parseFloat(cs.paddingTop) -
            parseFloat(cs.paddingBottom),
        };
      }

      function fitFontSize(el) {
        const parent = el.parentElement;
        if (!parent) return;
        el.style.transform = "";
        el.style.fontSize = "";
        const fits = () => {
          const box = innerBox(parent);
          return el.scrollHeight <= box.h && el.scrollWidth <= box.w;
        };

        const base = parseFloat(getComputedStyle(el).fontSize);
        let hi = base * MAX_GROW;
        el.style.fontSize = hi + "px";
        if (fits()) return;

        let lo = 6;
        let best = lo;
        for (let i = 0; i < 20; i++) {
          const mid = (lo + hi) / 2;
          el.style.fontSize = mid + "px";
          if (fits()) {
            best = mid;
            lo = mid;
          } else {
            hi = mid;
          }
        }
        el.style.fontSize = best + "px";
      }

      function bestFontSize(el, maxGrow) {
        const parent = el.parentElement;
        if (!parent) return null;
        const base = parseFloat(getComputedStyle(el).fontSize);
        const fits = () => {
          const box = innerBox(parent);
          return el.scrollHeight <= box.h && el.scrollWidth <= box.w;
        };
        let hi = base * (maxGrow ?? MAX_GROW);
        el.style.fontSize = hi + "px";
        if (fits()) return hi;
        let lo = 6;
        let best = lo;
        for (let i = 0; i < 14; i++) {
          const mid = (lo + hi) / 2;
          el.style.fontSize = mid + "px";
          if (fits()) {
            best = mid;
            lo = mid;
          } else {
            hi = mid;
          }
        }
        return best;
      }

      const NOWRAP_FLOOR = 0.4;
      const MIN_RATIO = 0.8;

      function freezeBasis(els, blocks) {
        els.forEach((el) => {
          el.style.fontSize = "";
        });
        blocks.forEach((b) => {
          if (b) b.style.flexBasis = "";
        });
        els.forEach((el, i) => {
          const b = blocks[i];
          if (!b) return;
          const cs = getComputedStyle(b);
          b.style.flexBasis =
            el.scrollHeight +
            parseFloat(cs.paddingTop) +
            parseFloat(cs.paddingBottom) +
            "px";
        });
      }

      function fitSongText(scope) {
        const els = Array.from(
          scope.querySelectorAll(".text-fit:not(.text-flow)"),
        );
        if (!els.length) return;
        const blocks = els.map((el) => el.parentElement);
        const isStream = !!els[0].closest(".out2");
        const maxGrow = isStream ? 1 : MAX_GROW;

        els.forEach((el) => {
          el.style.transform = "";
          el.style.whiteSpace = "pre";
        });
        freezeBasis(els, blocks);

        const base = parseFloat(getComputedStyle(els[0]).fontSize);
        let sizes = els.map((el) => bestFontSize(el, maxGrow));

        if (sizes.some((v) => v !== null && v < base * NOWRAP_FLOOR)) {
          els.forEach((el, i) => {
            if (sizes[i] !== null && sizes[i] < base * NOWRAP_FLOOR) {
              el.style.whiteSpace = "";
            }
          });
          freezeBasis(els, blocks);
          sizes = els.map((el) => bestFontSize(el, maxGrow));
        }

        const valid = sizes.filter((v) => v !== null);
        if (!valid.length) return;
        if (isStream) {
          const size = Math.min(...valid);
          els.forEach((el, i) => {
            if (sizes[i] === null) return;
            el.style.fontSize = size + "px";
          });
          return;
        }
        const cap = Math.min(...valid) / MIN_RATIO;
        els.forEach((el, i) => {
          if (sizes[i] === null) return;
          el.style.fontSize = Math.min(sizes[i], cap) + "px";
        });
      }

      function fitContent(root) {
        const scope = root || document;
        Array.from(scope.querySelectorAll(".text-flow")).forEach(fitFontSize);
        fitSongText(scope);
      }

      const layers = Array.from(document.querySelectorAll(".layer"));
      let frontIndex = 0;
      let shownHtml = null;

      function applyUpdate(html) {
        if (html === shownHtml) return;
        shownHtml = html;

        const front = layers[frontIndex];
        const back = layers[1 - frontIndex];

        back.innerHTML = html;
        fitContent(back);

        requestAnimationFrame(() => {
          back.classList.add("active");
          front.classList.remove("active");
          frontIndex = 1 - frontIndex;
        });
      }

      function applyBlackout(active) {
        const el = document.getElementById("content");
        if (active) el.classList.add("blackout");
        else el.classList.remove("blackout");
      }

      function applyConfig(config) {
        if (config && typeof config.bg === "string") {
          document.documentElement.style.background = config.bg;
          document.body.style.background = config.bg;
        }
      }

      ipcRenderer.on("hdmi-update", (_, html) => applyUpdate(html));
      ipcRenderer.on("hdmi-blackout", (_, active) => applyBlackout(active));
      ipcRenderer.on("hdmi-config", (_, config) => applyConfig(config));

      window.addEventListener("message", (e) => {
        const d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "view-update") applyUpdate(d.html);
        else if (d.type === "view-blackout") applyBlackout(d.active);
        else if (d.type === "view-config") applyConfig(d.config);
      });

      window.addEventListener("resize", () => {
        layers.forEach((l) => fitContent(l));
      });
    </script>
  </body>
</html>
